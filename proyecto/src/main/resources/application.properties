spring.application.name=proyecto

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/proyecto_profesion?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:proyecto}
spring.datasource.password=${DB_PASSWORD:cambia_esta_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Desarrollo. Para producción usa Flyway/Liquibase y ddl-auto=validate.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=${SHOW_SQL:false}

# Webhooks n8n
n8n.webhook.url=${N8N_WEBHOOK_URL:}
n8n.webhook.inbound-secret=${N8N_WEBHOOK_SECRET:}
n8n.webhook.outbound-secret=${N8N_OUTBOUND_SECRET:}

# Cada día a las 02:00, hora peninsular
app.sync.cron=${SYNC_CRON:0 0 2 * * *}
app.sync.zone=${SYNC_ZONE:Europe/Madrid}

server.port=${PORT:8080}
server.error.include-message=never
